<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${task != null} ? 'Edit Task' : 'Create New Task'">Task Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">Task Management</a>
    <div class="navbar-nav">
      <a class="nav-link" th:href="@{/topics}">Topics</a>
      <a class="nav-link active" th:href="@{/tasks}">Tasks</a>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-header">
          <h4 class="card-title mb-0">
            <i class="bi bi-card-checklist"></i>
            <th:block th:text="${task != null} ? 'Edit Task' : 'Create New Task'">Task Form</th:block>
          </h4>
        </div>
        <div class="card-body">
          <form th:action="${task != null and task.id != null} ? @{/tasks/update/{id}(id=${task.id})} : @{/tasks}"
                method="post" th:object="${task}">

            <div class="mb-3">
              <label for="title" class="form-label">Title *</label>
              <input type="text" class="form-control" id="title"
                     th:field="*{title}" required maxlength="200"
                     placeholder="Enter task title">
            </div>

            <div class="mb-3">
              <label for="description" class="form-label">Description</label>
              <textarea class="form-control" id="description"
                        th:field="*{description}" rows="4" maxlength="1000"
                        placeholder="Enter task description"></textarea>
            </div>

            <div class="mb-3">
              <label for="completionStatus" class="form-label">Status *</label>
              <select class="form-select" id="completionStatus"
                      th:field="*{completionStatus}" required>
                <option th:each="status : ${allStatuses}"
                        th:value="${status}"
                        th:text="${status.name()}">
                </option>
              </select>
            </div>

            <div class="mb-3">
              <label for="topicId" class="form-label">Topic *</label>
              <select class="form-select" id="topicId" name="topicId" required>
                <option value="">Select Topic</option>
                <option th:each="topic : ${topics}"
                        th:value="${topic.id}"
                        th:text="${topic.title}"
                        th:selected="${(task != null and task.topic != null) ? (topic.id == task.topic.id) : false}">
                </option>
              </select>
              <div class="form-text">Select the topic this task belongs to</div>
            </div>

            <div class="d-flex justify-content-between">
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-circle"></i>
                <th:block th:text="${task != null} ? 'Update Task' : 'Create Task'">Submit</th:block>
              </button>

              <a th:href="@{/tasks}" class="btn btn-secondary">
                <i class="bi bi-x-circle"></i> Cancel
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
