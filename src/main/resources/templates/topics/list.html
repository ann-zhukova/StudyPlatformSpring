<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Topics List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
  <style>
    .action-buttons {
      white-space: nowrap;
    }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">Task Management</a>
    <div class="navbar-nav">
      <a class="nav-link active" th:href="@{/topics}">Topics</a>
      <a class="nav-link" th:href="@{/tasks}">Tasks</a>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>All Topics</h2>
    <a th:href="@{/topics/create}" class="btn btn-primary">
      <i class="bi bi-plus-circle"></i> New Topic
    </a>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Description</th>
            <th>Estimated Hours</th>
            <th>Tasks Count</th>
            <th>Actions</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="topic : ${topics}">
            <td th:text="${topic.id}">1</td>
            <td th:text="${topic.title}">Topic Title</td>
            <td th:text="${topic.description}">Topic Description</td>
            <td>
              <span th:if="${topic.estimatedHours > 0}" th:text="${topic.estimatedHours}">0</span>
              <span th:unless="${topic.estimatedHours > 0}" class="text-muted">Not set</span>
            </td>
            <td>
              <span class="badge bg-info" th:text="${topic.tasks.size()}">0</span>
            </td>
            <td class="action-buttons">
              <a th:href="@{/tasks(topicId=${topic.id})}"
                 class="btn btn-sm btn-outline-primary me-1"
                 title="View tasks">
                <i class="bi bi-eye"></i> Tasks
              </a>
              <a th:href="@{/topics/edit/{id}(id=${topic.id})}"
                 class="btn btn-sm btn-outline-secondary me-1"
                 title="Edit topic">
                <i class="bi bi-pencil"></i> Edit
              </a>
              <a th:href="@{/topics/delete/{id}(id=${topic.id})}"
                 class="btn btn-sm btn-outline-danger"
                 title="Delete topic"
                 onclick="return confirm('Are you sure you want to delete this topic?')">
                <i class="bi bi-trash"></i> Delete
              </a>
            </td>
          </tr>
          <tr th:if="${topics.empty}">
            <td colspan="6" class="text-center">
              No topics found. <a th:href="@{/topics/create}">Create your first topic</a>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
