<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${topic != null and topic.id != null} ? 'Edit Topic' : 'Create New Topic'">Topic Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">Task Management</a>
    <div class="navbar-nav">
      <a class="nav-link active" th:href="@{/topics}">Topics</a>
      <a class="nav-link" th:href="@{/tasks}">Tasks</a>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-header">
          <h4 class="card-title mb-0">
            <i class="bi bi-collection"></i>
            <th:block th:text="${topic != null and topic.id != null} ? 'Edit Topic' : 'Create New Topic'">Topic Form</th:block>
          </h4>
        </div>
        <div class="card-body">
          <form th:action="${topic != null and topic.id != null} ? @{/topics/update/{id}(id=${topic.id})} : @{/topics}"
                method="post" th:object="${topic}">

            <div class="mb-3">
              <label for="title" class="form-label">Title *</label>
              <input type="text" class="form-control" id="title"
                     th:field="*{title}" required maxlength="200"
                     placeholder="Enter topic title">
            </div>

            <div class="mb-3">
              <label for="description" class="form-label">Description</label>
              <textarea class="form-control" id="description"
                        th:field="*{description}" rows="4" maxlength="1000"
                        placeholder="Enter topic description"></textarea>
            </div>

            <div class="mb-3">
              <label for="estimatedHours" class="form-label">Estimated Hours</label>
              <input type="number" class="form-control" id="estimatedHours" min="0"
                     th:field="*{estimatedHours}">
              <div class="form-text">Set the estimated number of hours for this topic</div>
            </div>

            <div class="d-flex justify-content-between">
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-circle"></i>
                <th:block th:text="${topic != null and topic.id != null} ? 'Update Topic' : 'Create Topic'">Submit</th:block>
              </button>

              <a th:href="@{/topics}" class="btn btn-secondary">
                <i class="bi bi-x-circle"></i> Cancel
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
